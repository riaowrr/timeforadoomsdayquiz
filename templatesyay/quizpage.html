<!DOCTYPE html>
<html>

<head>
    <title>Try this quiz out!</title>

    <style>
        body {
            font-family: Times New Roman;
            background-color: #23541e;
            padding: 40px;
            color: #000000;
        }

        h1 {
            text-align: center;
        }

        .question {
            background-color: #d8e8da;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border: 1px solid #000000
        }

        .option {
            display: block;
            margin: 12px 0px;
        }

        button {
            background-color: #000000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 0px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Quiz</h1>

    
    {% if result %}
    <p style="text-align: center;">
        {{ result }}
    </p>
    {% endif %}

    
    {% for question in questions %}

        <div class="question">
            <h3>{{question.question}}</h3>
            {% if question.image %}
                <img src="{{url_for('static', filename=question.image)}}"
                style="max-width: 100%; width: 400px; height: auto;">
            {% endif %}
            
            <form action="/quiz" method="POST">
                <input
                    type="hidden"
                    name="question_number"
                    value="{{loop.index0}}"
                >

                
                {% for option in question.options %}
                    <label class="option">
                        <input
                            type="radio"
                            name="answer"
                            value="{{option}}"
                            required
                        >

                        {{option}}
                    </label>
                {% endfor %}

                <button type="submit">Submit Answer</button>
            </form>
        </div>
    {% endfor %}

    <p style="text-align: center;">
        <a href="/">Back to Home</a>
    </p>
</body>
</html>
